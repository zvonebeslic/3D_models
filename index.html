<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo Print Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="cube">V</div><div><h1>Logo Print Lab</h1><p>Učitaj logo → ukloni pozadinu → full-color SVG</p></div></header><section class="card"><h2>1. Učitaj logo</h2><label class="drop" id="drop"><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp"><span>◈</span><strong>Odaberi PNG, JPG ili WEBP</strong><small>Obrada se radi na tvom uređaju</small></label><div id="previewWrap" class="preview hidden"><img id="preview" alt="Originalni logo"><button id="removeImage">Ukloni</button></div></section><section class="card"><h2>2. Obradi logo</h2><div class="twoActions"><button class="toolAction" id="removeBg" disabled><b>✦ BACKGROUND REMOVE</b><span>Automatski ukloni samo povezanu vanjsku pozadinu</span></button><button class="toolAction primaryTool" id="vectorize" disabled><b>◆ FULL VECTOR SVG</b><span>Vektoriziraj sve boje i oblike unutar loga</span></button></div><div id="status" class="status hidden"></div></section><section class="card hidden" id="bgResultCard"><h2>Transparentni logo</h2><div class="checker singleResult"><canvas id="bgCanvas"></canvas></div><div class="actions"><button class="primary" id="downloadPng">Preuzmi transparentni PNG</button></div></section><section class="card hidden" id="resultCard"><h2>Full Vector Print Ready</h2><div class="compare"><div><span>IZVOR</span><div class="checker"><canvas id="cleanPreview"></canvas></div></div><div><span>100% VEKTORSKI SVG</span><div id="svgResult" class="checker svgResult"></div></div></div><div class="stats" id="stats"></div><div class="zoomRow"><label>Inspekcija <strong id="zoomValue">100%</strong><input id="zoom" type="range" min="25" max="10000" value="100"></label></div><div class="actions"><button class="primary" id="downloadSvg">Preuzmi SVG</button></div></section><footer>Logo Print Lab • full-color vector engine</footer></main><script src="fullvector.js?v=4"></script><script src="vector.js?v=12"></script></body></html>
